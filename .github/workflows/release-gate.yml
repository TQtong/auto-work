name: 发布门禁

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Windows 完整发布门禁
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0（Node 24）

      - name: 安装 pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9（Node 24）
        with:
          version: 10.14.0
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0（Node 24）
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 执行完整发布门禁
        run: pnpm release:gate

      - name: 上传发布包、SBOM 与校验和
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1（Node 24）
        with:
          name: auto-work-release-${{ github.sha }}
          path: |
            dist/release/*.zip
            dist/release/*.zip.sha256
            dist/release/*/SBOM.cdx.json
            dist/release/*/SHA256SUMS
            dist/release/*/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  docker-smoke:
    name: Linux Docker 构建与启动验收
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0（Node 24）

      - name: 校验 Compose 并构建固定基础镜像
        run: |
          docker compose config --quiet
          docker compose --progress plain build

      - name: 启动、健康、持久化与安全约束验收
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            status="$?"
            # 仅在失败时打印末尾日志，成功时保持流水线输出简洁。
            if [ "$status" -ne 0 ]; then
              docker compose logs --no-color --tail=150 auto-work || true
            fi
            docker compose down --volumes || true
            return "$status"
          }
          trap cleanup EXIT

          smoke_dir="${RUNNER_TEMP}/auto-work-docker-smoke"
          mkdir -p "$smoke_dir"

          # 构造真实一级仓库，确保 Linux 容器不仅能启动，还能实际执行 Git 扫描。
          mkdir -p repositories/ci-sample
          git -C repositories/ci-sample init
          git -C repositories/ci-sample config user.name 'Auto Work CI'
          git -C repositories/ci-sample config user.email 'ci@auto-work.local'
          printf '%s\n' '# CI repository' > repositories/ci-sample/README.md
          git -C repositories/ci-sample add README.md
          git -C repositories/ci-sample commit -m '初始化 Docker 扫描仓库'

          docker compose up --detach --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:3760/api/v1/health > "$smoke_dir/health.json"
          grep --quiet '"status":"ready"' "$smoke_dir/health.json"
          curl --fail --silent --show-error http://127.0.0.1:3760/ > "$smoke_dir/index.html"
          grep --quiet '<div id="root">' "$smoke_dir/index.html"

          curl --fail --silent --show-error \
            --cookie-jar "$smoke_dir/cookies.txt" \
            http://127.0.0.1:3760/api/v1/session > "$smoke_dir/session.json"
          csrf_token="$(jq --raw-output '.data.csrfToken' "$smoke_dir/session.json")"
          curl --fail --silent --show-error \
            --cookie "$smoke_dir/cookies.txt" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header 'Origin: http://127.0.0.1:3760' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --request POST \
            --data '{}' \
            http://127.0.0.1:3760/api/v1/projects/discover > "$smoke_dir/discover.json"
          operation_path="$(jq --raw-output '.data.statusUrl' "$smoke_dir/discover.json")"
          for _ in $(seq 1 120); do
            curl --fail --silent --show-error \
              --cookie "$smoke_dir/cookies.txt" \
              "http://127.0.0.1:3760${operation_path}" > "$smoke_dir/discover-status.json"
            operation_status="$(jq --raw-output '.data.status' "$smoke_dir/discover-status.json")"
            if [[ "$operation_status" != 'queued' && "$operation_status" != 'running' ]]; then
              break
            fi
            sleep 0.5
          done
          jq --exit-status \
            '(.data.status == "succeeded") and ((.data.result.repositories | length) == 1) and ((.data.result.warnings | length) == 0)' \
            "$smoke_dir/discover-status.json"

          container="$(docker compose ps --quiet auto-work)"
          test "$(docker inspect "$container" --format '{{.Config.User}}')" = 'node'
          test "$(docker inspect "$container" --format '{{.HostConfig.ReadonlyRootfs}}')" = 'true'
          cap_drop="$(docker inspect "$container" --format '{{json .HostConfig.CapDrop}}')"
          security_options="$(docker inspect "$container" --format '{{json .HostConfig.SecurityOpt}}')"
          [[ "$cap_drop" == *'ALL'* ]]
          [[ "$security_options" == *'no-new-privileges'* ]]

          docker exec "$container" sh -c "printf '%s' 'persisted' > /app/data/ci-volume-smoke"
          docker compose restart auto-work
          docker compose up --detach --wait --wait-timeout 180
          container="$(docker compose ps --quiet auto-work)"
          test "$(docker exec "$container" cat /app/data/ci-volume-smoke)" = 'persisted'
          # 先完整保存日志再断言，避免 grep -q 提前关管道触发 Compose broken pipe（退出码 255）。
          docker compose logs --no-color auto-work > "$smoke_dir/container.log"
          grep --quiet 'No pending migrations to apply.' "$smoke_dir/container.log"
